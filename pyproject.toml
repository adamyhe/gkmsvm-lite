[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gkmsvm-lite"
version = "0.1.0"
description = "Gapped k-mer SVMs for DNA sequence classification and regression"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    {name = "Adam Youlin He", email = "ayhe@stanford.edu"},
]
dependencies = [
    "numpy",
    "numba>=0.57",
    "tqdm",
    "libsvm-official>=3.30",
]

[project.scripts]
gkmsvm = "gkmsvm.cli:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x[ctk]>=12.0",
]
mlx = [
    "mlx>=0.10.0",
]
dev = [
    "pytest",
    "pytest-cov",
]
bench = [
    "scikit-learn>=1.0",
    "py2bit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gkmsvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
