[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gkmsvm-lite"
version = "0.1.0"
description = "Gapped k-mer SVMs for DNA sequence classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Adam Youlin He", email = "ayhe@stanford.edu"},
]
dependencies = [
    "numpy",
    "numba>=0.57",
    "tqdm",
    "libsvm-official>=3.30",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0",
]
dev = [
    "pytest",
    "pytest-cov",
]
bench = [
    "scikit-learn>=1.0",
    "py2bit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gkmsvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
