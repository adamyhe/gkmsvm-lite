[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gkmsvm-lite"
version = "0.2.0"
description = "Gapped k-mer SVMs for DNA sequence classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Adam Youlin He", email = "ayhe@stanford.edu"},
]
dependencies = [
    "numpy",
    "numba>=0.57",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0",
]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gkmsvm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
